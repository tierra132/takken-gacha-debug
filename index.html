function weighted(t){
  const arr=Array.isArray(t)?t:[];
  const normalized=arr.map((x,i)=>{
    if(Array.isArray(x)) return [String(x[0]||""),String(x[1]??""),Number(x[2])||0,i];
    if(x&&typeof x==="object") return [String(x.rarity||""),String(x.reward??""),Number(x.probability)||0,i];
    return null;
  }).filter(x=>x&&x[0]&&x[0]!=="なし"&&Number(x[2])>0);
  if(!normalized.length) throw new Error("INVALID_GACHA_TABLE");
  const total=normalized.reduce((a,x)=>a+Number(x[2]),0);
  const r=Math.random()*total; let acc=0;
  for(const x of normalized){acc+=Number(x[2]);if(r<acc)return x;}
  return normalized[normalized.length-1];
}

async function ensureCloudState(){
  setCloudStatus("☁️ Firebase接続中…");
  const seed=readLocalSeed();
  const result=await runTransaction(db,async tx=>{
    const snap=await tx.get(STATE_REF);
    if(snap.exists()){
      const current=normalizeState(snap.data());
      const changed=applyStudyDayReset(current);
      if(changed)tx.set(STATE_REF,toFirestoreState(current));
      return current;
    }
    applyStudyDayReset(seed);
    tx.set(STATE_REF,toFirestoreState(seed));
    return seed;
  });
  state=normalizeState(result);
  cloudReady=true;
  cacheLocal();
  setCloudStatus("☁️ データ共有中");
  render();
}

async function refreshCloud(){
  const snap=await getDoc(STATE_REF);
  if(!snap.exists()){
    await ensureCloudState();
    return;
  }
  const before=JSON.stringify(snap.data().tables||null);
  state=normalizeState(snap.data());
  const resetChanged=applyStudyDayReset(state);
  const after=JSON.stringify(encodeTables(state.tables));
  cloudReady=true;
  cacheLocal();
  setCloudStatus("☁️ データ共有中");
  render();
  // If the old Firebase data had the broken undefined/0 table format,
  // repair it once using the intended default tables.
  if(before!==after || resetChanged){
    await updateCloud(()=>state);
  }
}

async function updateCloud(mutator){
  if(!cloudReady)throw new Error("Firebaseに接続できていません");
  const result=await runTransaction(db,async tx=>{
    const snap=await tx.get(STATE_REF);
    const current=normalizeState(snap.exists()?snap.data():state);
    const base=normalizeState(current);applyStudyDayReset(base);const updated=normalizeState(await mutator(base));
    tx.set(STATE_REF,toFirestoreState(updated));
    return updated;
  });
  state=normalizeState(result);
  cacheLocal();
  render();
  return state;
}

function ceilingForNextDraw(g){
  const c=normalizeCeiling(g?.ceiling);
  if(!c.enabled)return null;
  const items=c.items.slice(0,c.slotCount).filter(x=>x&&Number(x.draws)>0&&x.reward);
  if(!items.length)return null;
  // 天井は「設定した回数そのもの」に到達した回だけ発動する。
  // 例：40回・80回なら、40/80/120/160…でのみ発動し、それ以外は通常抽選。
  const cycle=Math.max(...items.map(x=>Number(x.draws)));
  const nextDraw=Number(c.progress||0)+1;
  const nextPos=((nextDraw-1)%cycle)+1;
  const target=items.find(x=>Number(x.draws)===nextPos);
  if(!target)return null;
  return {index:c.items.indexOf(target),rarity:target.rarity||"SSR",reward:target.reward,slotCount:c.slotCount};
}

async function doDraw(type,count){
  closeModal();
  try{
    const result=await runTransaction(db,async tx=>{
      const snap=await tx.get(STATE_REF);
      const s=normalizeState(snap.exists()?snap.data():state);
      if(s.tickets<count)throw new Error("NOT_ENOUGH_TICKETS");
      if(!isGachaOpen(type,s.gachas[type]))throw new Error("GACHA_CLOSED");
      const dateKey=jpDateKey(), time=new Date().toLocaleString("ja-JP");
      const results=[];
      const ceiling=normalizeCeiling(s.gachas[type]?.ceiling);
      let progress=ceiling.progress;
      const drawOne=(drawNo,paid)=>{
        const nextProgress=progress+1;
        const guaranteed=ceilingForNextDraw({...s.gachas[type],ceiling:{...ceiling,progress}});
        progress=nextProgress;
        // 天井回以外は、通常の排出設定または11回目専用確率で抽選する。
        // 天井のごほうびを通常抽選へ混ぜることは絶対にしない。
        if(guaranteed){
          return {rarity:guaranteed.rarity||"SSR",reward:String(guaranteed.reward||"").slice(0,20),drawNo,paid,ceiling:true};
        }
        const tableKey=(drawNo===11 && count===10)?type+"Bonus":type;
        const x=weighted(s.tables[tableKey]);
        // 11回目専用テーブルは確率だけを持つため、選ばれたスロットと
        // 同じ通常テーブルのスロットからレアリティ・ごほうびを取得する。
        if(drawNo===11 && count===10){
          const base=Array.isArray(s.tables[type])?s.tables[type]:[];
          const baseSlot=base[x[3]];
          return {rarity:String(baseSlot?.[0]||x[0]),reward:String(baseSlot?.[1]||"").slice(0,20),drawNo,paid,ceiling:false};
        }
        return {rarity:x[0],reward:String(x[1]||"").slice(0,20),drawNo,paid,ceiling:false};
      };
      for(let i=0;i<count;i++)results.push(drawOne(i+1,true));
      if(count===10)results.push(drawOne(11,false));
      s.gachas[type].ceiling=ceiling;
      s.gachas[type].ceiling.progress=progress;
      s.tickets-=count;
      results.forEach(x=>{
        s.history.push({time,dateKey,type,gachaName:String(s.gachas[type]?.name||"").slice(0,30),drawNo:x.drawNo,rarity:x.rarity,reward:x.reward,paid:x.paid});
        if(["SR","SSR","UR"].includes(x.rarity) && x.reward){
          s.rewards.push({id:"r_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2),time,dateKey,type,gachaName:String(s.gachas[type]?.name||"").slice(0,30),rarity:x.rarity,reward:x.reward,used:false});
        }
      });
      tx.set(STATE_REF,toFirestoreState(s));
      return {state:s,results};
    });
    state=normalizeState(result.state);
    cloudReady=true;
    cacheLocal();
    render();
    showResults(result.results,0);
  }catch(err){
    console.error(err);
    if(err.message==="GACHA_CLOSED"){
      await refreshCloud();
      openModal(`<h2>現在は引けません</h2><p>このガチャは予告中です。<br>${escapeHtml(gachaOpenLabel(type))}</p><button class="singleBtn" id="modalCloseBtn">OK</button>`);
    }else if(err.message==="NOT_ENOUGH_TICKETS"){
      await refreshCloud();
      openModal(`<h2>回数券が足りません</h2><p>別の端末で回数券が使われた可能性があります。最新の状態に更新しました。</p><button class="singleBtn" id="modalCloseBtn">OK</button>`);
    }else if(err.message==="INVALID_GACHA_TABLE"){
      openModal(`<h2>ガチャ設定を読み込めません</h2><p>ガチャの排出設定の形式を修復する必要があります。</p><p>管理画面の確率設定を初期値に戻す処理を行います。</p><button class="singleBtn" id="modalCloseBtn">OK</button>`);
    }else{
      openModal(`<h2>ガチャを保存できませんでした</h2><p>Firebaseへの接続でエラーが発生しました。</p><p style="font-size:12px;text-align:left;word-break:break-word;background:#111;padding:10px;border-radius:8px;">${escapeHtml((err && (err.code || err.message)) ? ((err.code||"") + " " + (err.message||"")) : String(err))}</p><button class="singleBtn" id="modalCloseBtn">OK</button>`);
    }
  }
}

function ceilingEditor(type){const c=normalizeCeiling(state.gachas[type]?.ceiling);const item=i=>c.items[i]||{draws:i===0?40:80,rarity:i===0?"SSR":"UR",reward:""};const rarityOptions=(selected)=>["N","R","SR","SSR","UR"].map(r=>`<option value="${r}" ${selected===r?"selected":""}>${r}</option>`).join("");return `<div class="sectionTitle">🎯 ${type==="red"?"赤":"青"}がちゃ 天井システム</div><label>天井システム</label><select id="${type}CeilingEnabled"><option value="off" ${!c.enabled?"selected":""}>なし</option><option value="on" ${c.enabled?"selected":""}>あり</option></select><label>天井の回数</label><select id="${type}CeilingSlots"><option value="1" ${c.slotCount===1?"selected":""}>1回</option><option value="2" ${c.slotCount===2?"selected":""}>2回</option></select><div class="adminGrid"><div><label>天井① 到達回数</label><input id="${type}CeilingCount1" type="number" min="1" step="1" value="${item(0).draws}"></div><div><label>天井① レアリティ</label><select id="${type}CeilingRarity1">${rarityOptions(item(0).rarity)}</select></div><div><label>天井① ごほうび</label><input id="${type}CeilingReward1" maxlength="20" value="${escapeHtml(item(0).reward)}" placeholder="最大20文字"></div></div><div class="adminGrid" id="${type}CeilingSecond"><div><label>天井② 到達回数</label><input id="${type}CeilingCount2" type="number" min="1" step="1" value="${item(1).draws}"></div><div><label>天井② レアリティ</label><select id="${type}CeilingRarity2">${rarityOptions(item(1).rarity)}</select></div><div><label>天井② ごほうび</label><input id="${type}CeilingReward2" maxlength="20" value="${escapeHtml(item(1).reward)}" placeholder="最大20文字"></div></div><label>現在のがちゃ回数</label><input id="${type}CeilingProgress" type="number" min="0" step="1" value="${c.progress}"><div class="note">※現在のがちゃ回数は管理画面から自由に変更できます。がちゃを引くと、引いた回数分だけ自動で増えます。天井到達後も現在のがちゃ回数はリセットされません。天井の有無や内容は自動表示しません。</div>`;}
function showAdmin(){const a=document.getElementById("admin");a.classList.add("open");document.getElementById("detail").classList.remove("open");a.innerHTML=`<h3>⚙ 管理画面</h3><label>ガチャ可能回数</label><input id="aTickets" type="number" min="0" value="${state.tickets}"><label>今日の勉強時間（分）</label><input id="aToday" type="number" min="0" value="${state.todayStudy}"><label>累計勉強時間（分）</label><input id="aTotal" type="number" min="0" value="${state.totalStudy}"><label>試験日</label><input id="aExam" type="date" value="${state.examDate}"><label>「今日の勉強時間」のリセット時刻</label><input id="aResetTime" type="time" value="${state.resetTime||DEFAULT_RESET_TIME}"><div class="note">※指定時刻になると「今日の勉強時間」が0分に切り替わります。初期値は6:00です。</div><label>ガチャ用パスワード（最大100文字）</label><input id="aGachaPassword" type="text" maxlength="100" value="${escapeHtml(state.gachaPassword)}" autocomplete="off"><div class="sectionTitle">🔴 赤がちゃ 表示設定</div><label>ガチャ名（最大30文字）</label><input id="redNameEdit" maxlength="30" value="${escapeHtml(state.gachas.red.name)}"><label>コメント</label><textarea class="adminTextarea" id="redCommentEdit" placeholder="ガチャ一覧に表示するコメント">${escapeHtml(state.gachas.red.comment)}</textarea><label>ガチャルール・説明</label><textarea class="adminTextarea" id="redRulesEdit" placeholder="ガチャ詳細で表示するルールや注意事項など">${escapeHtml(state.gachas.red.rules||"")}</textarea><div class="note">※コメント・ガチャルールに文字数制限はありません。改行もそのまま表示されます。</div><label>ガチャ公開状態</label><select id="redOpenMode"><option value="open" ${state.gachas.red.openMode==="open"?"selected":""}>開放中（いつでも引ける）</option><option value="closed" ${state.gachas.red.openMode==="closed"?"selected":""}>予告中（引けない）</option><option value="auto" ${state.gachas.red.openMode==="auto"?"selected":""}>指定曜日・時刻から自動開放</option></select><div class="adminGrid"><label>自動開放する曜日</label><select id="redAutoWeekday">${["日","月","火","水","木","金","土"].map((d,i)=>`<option value="${i}" ${Number(state.gachas.red.autoWeekday)===i?"selected":""}>${d}曜日</option>`).join("")}</select><label>自動開放時刻</label><input id="redAutoTime" type="time" value="${state.gachas.red.autoTime||"18:00"}"></div><div class="note">※「指定曜日・時刻から自動開放」を選ぶと、保存した時点から見て次に来る曜日・時刻に一度だけ開放し、その後は開放状態が続きます。</div>${ceilingEditor("red")}${tableEditor("red","🔴 赤がちゃ 排出設定",true)}<button class="smallbtn" id="redReset">🔄 赤がちゃ設定を初期化</button><div class="sectionTitle">🔵 青がちゃ 表示設定</div><label>ガチャ名（最大30文字）</label><input id="blueNameEdit" maxlength="30" value="${escapeHtml(state.gachas.blue.name)}"><label>コメント</label><textarea class="adminTextarea" id="blueCommentEdit" placeholder="ガチャ一覧に表示するコメント">${escapeHtml(state.gachas.blue.comment)}</textarea><label>ガチャルール・説明</label><textarea class="adminTextarea" id="blueRulesEdit" placeholder="ガチャ詳細で表示するルールや注意事項など">${escapeHtml(state.gachas.blue.rules||"")}</textarea><div class="note">※コメント・ガチャルールに文字数制限はありません。改行もそのまま表示されます。</div><label>ガチャ公開状態</label><select id="blueOpenMode"><option value="open" ${state.gachas.blue.openMode==="open"?"selected":""}>開放中（いつでも引ける）</option><option value="closed" ${state.gachas.blue.openMode==="closed"?"selected":""}>予告中（引けない）</option><option value="auto" ${state.gachas.blue.openMode==="auto"?"selected":""}>指定曜日・時刻から自動開放</option></select><div class="adminGrid"><label>自動開放する曜日</label><select id="blueAutoWeekday">${["日","月","火","水","木","金","土"].map((d,i)=>`<option value="${i}" ${Number(state.gachas.blue.autoWeekday)===i?"selected":""}>${d}曜日</option>`).join("")}</select><label>自動開放時刻</label><input id="blueAutoTime" type="time" value="${state.gachas.blue.autoTime||"18:00"}"></div><div class="note">※「指定曜日・時刻から自動開放」を選ぶと、保存した時点から見て次に来る曜日・時刻に一度だけ開放し、その後は開放状態が続きます。</div>${ceilingEditor("blue")}${tableEditor("blue","🔵 青がちゃ 排出設定",true)}<button class="smallbtn" id="blueReset">🔄 青がちゃ設定を初期化</button>${tableEditor("redBonus","🔴 赤がちゃ 11回目の確率",false)}${tableEditor("blueBonus","🔵 青がちゃ 11回目の確率",false)}<div class="adminGrid"><button class="smallbtn" id="adminSave">修正を保存</button><button class="smallbtn" id="adminClose">閉じる</button></div><hr><p style="font-size:12px;color:#777">※11回目は通常設定の同じ枠（スロット）にあるレアリティ・ごほうびを使用し、確率だけ別に設定します。同じレアリティを複数枠に設定した場合も、それぞれのごほうびを区別できます。SR以上のごほうびは「ごほうびBOX」に保管されます。</p><div class="sectionTitle">🧹 データ整理</div><div class="adminGrid"><button class="smallbtn danger" id="clearRewards">🎁 ごほうびBOXを一括削除</button><button class="smallbtn danger" id="clearHistory">📜 ガチャ履歴を一括削除</button></div><button class="smallbtn danger" id="reset">全データ初期化</button>`;document.getElementById("redReset").onclick=()=>resetGacha("red");document.getElementById("blueReset").onclick=()=>resetGacha("blue");document.getElementById("clearRewards").onclick=async()=>{if(!confirm(`ごほうびBOXに保管されているごほうびをすべて削除します。\n\nこの操作は取り消せません。よろしいですか？`))return;try{await updateCloud(s=>{s.rewards=[];return s});showAdmin()}catch(err){console.error(err);openModal(`<h2>ごほうびBOXを削除できませんでした</h2><p>Firebaseへの接続を確認してください。</p><button class="singleBtn" id="modalCloseBtn">OK</button>`);}};document.getElementById("clearHistory").onclick=async()=>{if(!confirm(`ガチャ履歴をすべて削除します。\n\nこの操作は取り消せません。よろしいですか？`))return;try{await updateCloud(s=>{s.history=[];return s});showAdmin()}catch(err){console.error(err);openModal(`<h2>ガチャ履歴を削除できませんでした</h2><p>Firebaseへの接続を確認してください。</p><button class="singleBtn" id="modalCloseBtn">OK</button>`);}};for(const type of ["red","blue"]){const toggle=()=>{const on=document.getElementById(`${type}CeilingEnabled`).value==="on";const two=document.getElementById(`${type}CeilingSlots`).value==="2";const box=document.getElementById(`${type}CeilingSecond`);if(box)box.style.display=two?"grid":"none";for(const id of [`${type}CeilingCount1`,`${type}CeilingRarity1`,`${type}CeilingReward1`]){const el=document.getElementById(id);if(el)el.disabled=!on}const progressEl=document.getElementById(`${type}CeilingProgress`);if(progressEl)progressEl.disabled=false;for(const id of [`${type}CeilingCount2`,`${type}CeilingRarity2`,`${type}CeilingReward2`]){const el=document.getElementById(id);if(el)el.disabled=!on||!two}};document.getElementById(`${type}CeilingEnabled`).onchange=toggle;document.getElementById(`${type}CeilingSlots`).onchange=toggle;toggle()}document.getElementById("adminSave").onclick=async()=>{const next=clone(state);next.tickets=Math.max(0,+document.getElementById("aTickets").value||0);next.todayStudy=Math.max(0,+document.getElementById("aToday").value||0);next.totalStudy=Math.max(0,+document.getElementById("aTotal").value||0);next.examDate=document.getElementById("aExam").value||"2026-10-18";next.resetTime=document.getElementById("aResetTime").value||DEFAULT_RESET_TIME;next.gachaPassword=document.getElementById("aGachaPassword").value.trim()||DEFAULT_GACHA_PASSWORD;for(const type of ["red","blue"]){const oldG=state.gachas[type]||{};const mode=document.getElementById(`${type}OpenMode`).value;const weekday=Number(document.getElementById(`${type}AutoWeekday`).value);const autoTime=document.getElementById(`${type}AutoTime`).value||"18:00";const scheduleChanged=mode!==oldG.openMode||weekday!==Number(oldG.autoWeekday)||autoTime!==String(oldG.autoTime||"18:00");let releaseAt=String(oldG.autoReleaseAt||"");if(mode==="auto"&&(scheduleChanged||!releaseAt))releaseAt=nextWeekdayDate(weekday,autoTime);if(mode!=="auto")releaseAt="";const ceilingEnabled=document.getElementById(`${type}CeilingEnabled`).value==="on";const ceilingSlots=Number(document.getElementById(`${type}CeilingSlots`).value)===2?2:1;const c1=Math.max(1,Math.floor(+document.getElementById(`${type}CeilingCount1`).value||40));const c2=Math.max(1,Math.floor(+document.getElementById(`${type}CeilingCount2`).value||80));const cr1=document.getElementById(`${type}CeilingRarity1`).value;const cr2=document.getElementById(`${type}CeilingRarity2`).value;const r1=document.getElementById(`${type}CeilingReward1`).value.trim();const r2=document.getElementById(`${type}CeilingReward2`).value.trim();const cp=Math.max(0,Math.floor(+document.getElementById(`${type}CeilingProgress`).value||0));if(ceilingEnabled){if(!r1){openModal(`<h2>天井のごほうびを確認してください</h2><p>${type}の天井①のごほうびを入力してください。</p><button class="singleBtn" id="modalCloseBtn">OK</button>`);return}if(r1.length>20||r2.length>20){openModal(`<h2>天井のごほうびを確認してください</h2><p>天井のごほうびは最大20文字です。</p><button class="singleBtn" id="modalCloseBtn">OK</button>`);return}if(ceilingSlots===2&&(!r2||c2<=c1)){openModal(`<h2>天井設定を確認してください</h2><p>天井②を使う場合は、ごほうびを入力し、到達回数を天井①より大きくしてください。</p><button class="singleBtn" id="modalCloseBtn">OK</button>`);return}}const oldC=normalizeCeiling(oldG.ceiling);next.gachas[type]={name:document.getElementById(`${type}NameEdit`).value.slice(0,30),comment:document.getElementById(`${type}CommentEdit`).value,rules:document.getElementById(`${type}RulesEdit`).value,openMode:mode,autoWeekday:weekday,autoTime,autoReleaseAt:releaseAt,ceiling:{enabled:ceilingEnabled,slotCount:ceilingSlots,items:[{draws:c1,rarity:cr1,reward:r1},{draws:c2,rarity:cr2,reward:r2}],progress:cp}};}for(const key of ["red","blue"]){let sum=0;for(let i=0;i<5;i++){const rarity=document.getElementById(`${key}_rar_${i}`).value;const reward=document.getElementById(`${key}_r_${i}`).value.trim();const p=Math.max(0,+document.getElementById(`${key}_p_${i}`).value||0);if(rarity==="なし"&&p>0){openModal(`<h2>確率を確認してください</h2><p>「なし」の枠は確率0%にしてください。</p><button class="singleBtn" id="modalCloseBtn">OK</button>`);return}if(reward.length>20){openModal(`<h2>文字数を確認してください</h2><p>${key}のごほうびは最大20文字です。</p><button class="singleBtn" id="modalCloseBtn">OK</button>`);return}next.tables[key][i]=[rarity,reward,p];sum+=p}if(Math.abs(sum-100)>.001){openModal(`<h2>確率を確認してください</h2><p>${key}の確率合計が <b>${sum}%</b> です。<br>100%になるよう修正してください。</p><button class="singleBtn" id="modalCloseBtn">OK</button>`);return}}for(const key of ["redBonus","blueBonus"]){let sum=0;const base=key.replace("Bonus","");for(let i=0;i<5;i++){const p=Math.max(0,+document.getElementById(`${key}_p_${i}`).value||0);next.tables[key][i]=[next.tables[base][i][0],"",p];sum+=p}if(Math.abs(sum-100)>.001){openModal(`<h2>11回目の確率を確認してください</h2><p>${key}の確率合計が <b>${sum}%</b> です。100%になるよう修正してください。</p><button class="singleBtn" id="modalCloseBtn">OK</button>`);return}}try{await updateCloud(()=>next);showAdmin()}catch(err){console.error(err);openModal(`<h2>保存できませんでした</h2><p>Firebaseへの接続でエラーが発生しました。</p><button class="singleBtn" id="modalCloseBtn">OK</button>`)}};document.getElementById("adminClose").onclick=()=>a.classList.remove("open");document.getElementById("reset").onclick=async()=>{if(confirm("全データを初期化します。よろしいですか？")){if(confirm("本当に削除しますか？")){try{await deleteDoc(STATE_REF);localStorage.removeItem(KEY);localStorage.removeItem(OLD_KEY);state=clone(defaults);cloudReady=false;await ensureCloudState();render();showAdmin()}catch(err){console.error(err);openModal(`<h2>初期化できませんでした</h2><p>Firebaseへの接続を確認してください。</p><button class="singleBtn" id="modalCloseBtn">OK</button>`)}}}}}

setInterval(()=>{if(cloudReady)render()},10000);

setInterval(async()=>{
  if(!cloudReady)return;
  const expected=studyDateKey(new Date(),state.resetTime);
  if(state.lastStudyDate!==expected){
    try{await updateCloud(s=>s)}catch(err){console.error(err)}
  }
},30000);

(async function init(){
  render();
  try{
    await ensureCloudState();
  }catch(err){
    console.error(err);
    cloudReady=false;
    state=readLocalSeed();
    render();
    setCloudStatus("⚠️ Firebase接続エラー");
    openModal(`<h2>Firebaseに接続できません</h2><p>Firebaseから返されたエラーを確認してください。</p><p style="font-size:12px;text-align:left;word-break:break-word;background:#111;color:#fff;padding:10px;border-radius:8px;">${escapeHtml((err && (err.code || err.message)) ? ((err.code||"") + " " + (err.message||"")) : String(err))}</p><button class="singleBtn" id="modalCloseBtn">OK</button>`);
  }
})();
setInterval(()=>{if(cloudReady)refreshCloud().catch(console.error);},60000);
</script>
</body>
</html>
